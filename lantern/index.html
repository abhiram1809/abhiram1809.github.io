<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Green Lantern — Awakening</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=Exo+2:wght@300;500;700;800&family=Noto+Sans+Runic&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />
  <script type="module" crossorigin src="/lantern/assets/index-EaC0XmZt.js"></script>
  <link rel="stylesheet" crossorigin href="/lantern/assets/index-DYwALlg1.css">
</head>
<body>
  <div id="app"></div>
  <div id="ui">
    <div id="letterbox"><div class="bar top"></div><div class="bar bottom"></div></div>
    <div id="frame"></div>
    <div id="hud">
      <div id="chapter"></div>
      <div id="objective"></div>
      <div id="clock"></div>
      <div id="life"><div class="cash"><b></b><i class="tab"></i></div><div class="lv"><span class="n"></span><span class="bar"><i></i></span><span class="pts"></span><span class="op"></span></div><div id="watched"><span class="eye"></span><span class="label"></span></div></div>
    </div>
    <div id="prompt"></div>
    <div id="subtitle"><div class="speaker"></div><div class="text"></div></div>
    <div id="overheard"><span class="speaker"></span><span class="text"></span></div>
    <div id="pick"><div class="title"></div><div class="options"></div></div>
    <div id="choice"><div class="question"></div><div class="options"></div><div class="keys"></div></div>
    <div id="controls"></div>
    <div id="checkpoint"></div>
    <div id="fade"></div>
    <div id="flash"></div>
    <div id="screen"></div>
    <div id="pause"></div>
    <div id="loading">
      <div class="title">Green Lantern</div>
      <div class="emblem" aria-hidden="true"></div>
      <div class="label" id="loading-label" role="status">Loading game code…</div>
      <div class="bar" role="progressbar" aria-labelledby="loading-label"><div class="fill"></div></div>
      <div class="progress-caption"><span class="detail"></span><span class="percent" aria-hidden="true"></span></div>
      <button class="retry" type="button" hidden>Retry</button>
      <noscript>Enable JavaScript to play.</noscript>
      <div class="tip"></div>
    </div>
  </div>
</body>
</html>
